<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>떨어진다!!! RIDE IT - chaechae studio</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: -apple-system, 'Pretendard', sans-serif; }

  #renderCanvas { width: 100%; height: 100%; touch-action: none; outline: none; display: block; }

  #uiRoot {
    position: fixed; inset: 0; pointer-events: none;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  #uiRoot .screen { pointer-events: auto; }

  .stage-select {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    height: 100%; gap: 16px; color: #fff; background: rgba(0,0,0,0.55);
  }
  .stage-select h1 { font-size: 28px; margin-bottom: 8px; }
  .stage-list { display: flex; flex-direction: column; gap: 10px; width: 85%; max-width: 400px; }
  .stage-btn {
    display: flex; flex-direction: column; align-items: flex-start;
    padding: 14px 16px; border-radius: 12px; border: none;
    background: rgba(255,255,255,0.1); color: #fff; min-height: 44px;
  }
  .stage-name { font-size: 17px; font-weight: 600; }
  .stage-motif { font-size: 12px; opacity: 0.7; margin-top: 4px; }
  .quality-toggle {
    margin-top: 12px; padding: 10px 18px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.3);
    background: transparent; color: #fff; min-height: 44px; min-width: 44px;
  }

  /* .hud는 전체 화면을 덮는 오버레이지만, 실제 조작(드래그 스타트/밸런스/게이트 탭)은
     input.js가 캔버스에서 직접 받아야 하므로 hud 자체는 클릭을 통과시키고
     그 안의 실제 버튼(camera-toggle)만 다시 pointer-events: auto로 살린다.
     (#uiRoot .screen의 pointer-events:auto보다 명시도가 같거나 높아야 하므로 #uiRoot .hud로 지정) */
  #uiRoot .hud { position: relative; height: 100%; pointer-events: none; }
  .top-bar {
    position: absolute; top: 12px; left: 0; right: 0;
    display: flex; justify-content: space-between; padding: 0 16px;
    color: #fff; font-size: 15px; text-shadow: 0 1px 3px rgba(0,0,0,0.6);
  }
  .start-hint {
    position: absolute; bottom: 25%; left: 0; right: 0; text-align: center;
    color: #fff; font-size: 16px; text-shadow: 0 1px 3px rgba(0,0,0,0.6);
  }
  .camera-toggle {
    position: absolute; bottom: env(safe-area-inset-bottom, 16px); right: 16px;
    padding: 10px 16px; border-radius: 20px; border: none;
    background: rgba(255,255,255,0.85); color: #111; min-height: 44px; min-width: 44px;
    pointer-events: auto;
  }
  .camera-toggle:disabled { opacity: 0.4; }

  .result {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    height: 100%; gap: 14px; color: #fff; background: rgba(0,0,0,0.7);
  }
  .result .score { font-size: 22px; }
  .result button { padding: 12px 22px; border-radius: 12px; border: none; min-height: 44px; }

  @media (prefers-color-scheme: light) {
    /* 라이트 모드에서도 UI는 게임 톤 유지 위해 다크 오버레이 고정 */
  }
</style>
</head>
<body>
  <canvas id="renderCanvas"></canvas>
  <div id="uiRoot"></div>

  <!-- Babylon.js CDN (UMD 빌드, 버전 고정) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babylonjs/7.25.0/babylon.js"></script>
  <!-- glTF/.glb 로더 — cdnjs엔 babylonjs-loaders 패키지가 없어 jsdelivr로 같은 버전 고정 -->
  <script src="https://cdn.jsdelivr.net/npm/babylonjs-loaders@7.25.0/babylonjs.loaders.min.js"></script>

  <!-- 게임 스크립트 (의존성 순서 유지) -->
  <script src="js/quality.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/stages.js"></script>
  <script src="js/track.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/camera.js"></script>
  <script src="js/input.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
