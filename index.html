<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>떨어진다!!! RIDE IT - chaechae studio</title>
<!-- PWA: 홈 화면 추가 시 전체화면 실행 + 오프라인 캐싱(sw.js) -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#141a33">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="떨어진다!!!">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="assets/icons/favicon-64.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
  :root {
    --yellow: #ffb80d;
    --yellow-deep: #d99700;
    --yellow-soft: #ffe08a;
    --navy: #141a33;
    --navy-2: #1f2850;
    --navy-3: #2d3a6e;
    --navy-soft: rgba(20, 26, 51, 0.82);
    --red: #ff5a4e;
    --green: #3ddc84;
    --sky-top: #2f7de1;
    --sky-bottom: #9fd8ff;
    --ease-pop: cubic-bezier(.34, 1.56, .64, 1);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    width: 100%; height: 100%; overflow: hidden; background: var(--navy);
    font-family: 'Jua', -apple-system, 'Pretendard', sans-serif;
    overscroll-behavior: none; /* 스타트 바 드래그 중 페이지 자체가 바운스/스크롤되는 것 방지 */
    -webkit-user-select: none; user-select: none;
  }

  #renderCanvas { width: 100%; height: 100%; touch-action: none; outline: none; display: block; }
  /* 속도감 스피드 라인 — 3D 캔버스와 UI 사이, 입력은 통과 */
  #speedLines { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  /* 고속 비네트: 가장자리를 어둡게 해 시야가 좁아지는 느낌 — opacity는 main.js가 속도 비례로 */
  .lap-banner { position: absolute; left: 0; right: 0; top: 34%; text-align: center; pointer-events: none; z-index: 6;
    font-size: 44px; color: #fff; letter-spacing: 2px; -webkit-text-stroke: 7px var(--navy); paint-order: stroke fill;
    animation: lapPop 1.8s var(--ease-pop) forwards; }
  .lap-banner.big { font-size: 54px; color: var(--yellow); }
  @keyframes lapPop { 0% { opacity: 0; transform: scale(.3) rotate(-6deg); } 18% { opacity: 1; transform: scale(1.12) rotate(2deg); } 30% { transform: scale(1) rotate(0); } 80% { opacity: 1; } 100% { opacity: 0; transform: translateY(-30px); } }
  .droplet { position: fixed; z-index: 4; pointer-events: none; border-radius: 50%; opacity: 0;
    background: radial-gradient(circle at 35% 30%, rgba(255,255,255,.85), rgba(190,230,255,.35) 45%, rgba(160,210,255,0) 70%);
    animation: dropFade 1.9s ease-out forwards; }
  @keyframes dropFade { 0% { opacity: 0; transform: scale(.4); } 10% { opacity: .95; transform: scale(1); } 100% { opacity: 0; transform: translateY(40px) scale(1.1); } }
  .mist-flash { position: fixed; inset: 0; z-index: 3; pointer-events: none;
    background: radial-gradient(ellipse at 50% 40%, rgba(255,255,255,.85), rgba(235,245,255,.6) 60%, rgba(255,255,255,.4)),
                linear-gradient(120deg, rgba(255,90,90,.18), rgba(255,241,90,.18), rgba(90,255,122,.18), rgba(90,180,255,.18), rgba(180,90,255,.18));
    animation: mistFade 2s ease-out forwards; }
  @keyframes mistFade { 0% { opacity: 0; } 12% { opacity: 1; } 100% { opacity: 0; } }
  #vignette { position: fixed; inset: 0; pointer-events: none; opacity: 0; background: radial-gradient(ellipse at 50% 55%, transparent 60%, rgba(10,6,24,.6) 100%); }

  #uiRoot, .ui-ghost {
    position: fixed; inset: 0; pointer-events: none;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  #uiRoot .screen { pointer-events: auto; }

  /* 화면 전환: 새 화면은 페이드+슬라이드 인, 직전 화면은 ui.js가 복제(ghost)해 페이드 아웃 → 크로스페이드 */
  @keyframes screenIn { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  @keyframes screenOut { from { opacity: 1; } to { opacity: 0; transform: translateY(-8px); } }
  @keyframes cardIn { from { opacity: 0; transform: scale(.92); } to { opacity: 1; transform: none; } }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  #uiRoot .screen { animation: screenIn .26s ease both; }
  #uiRoot .hud { animation: fadeIn .22s ease both; }
  .ui-ghost { z-index: 5; animation: screenOut .2s ease forwards; }
  .ui-ghost * { pointer-events: none !important; }
  .modal-overlay .card { animation: cardIn .26s var(--ease-pop) both; }

  /* ── 버튼: 통통한 입체(아래 그림자 턱) + 눌림 시 턱이 사라지며 내려앉음 ── */
  #uiRoot button {
    font-family: inherit; cursor: pointer; border: none; /* 색은 각 버튼 클래스가 지정(여기서 inherit하면 흰 카드 위 흰 글씨) */
    transition: transform .08s ease, box-shadow .08s ease, filter .15s ease;
  }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    min-height: 48px; padding: 12px 24px; border-radius: 16px; font-size: 18px;
    background: var(--navy-3); color: #fff; box-shadow: 0 4px 0 #111733, 0 8px 18px rgba(0,0,0,.25);
  }
  .btn.primary { background: var(--yellow); color: var(--navy); box-shadow: 0 5px 0 var(--yellow-deep), 0 10px 20px rgba(0,0,0,.25); }
  .btn.wide { width: 100%; }
  #uiRoot .btn:active, #uiRoot .pill:active, #uiRoot .stage-btn:active, #uiRoot .hud-icon-btn:active {
    transform: translateY(4px); box-shadow: 0 0 0 transparent, 0 2px 6px rgba(0,0,0,.2);
  }
  .btn svg, .pill svg { width: 20px; height: 20px; flex: none; }
  #uiRoot button:disabled { opacity: .45; box-shadow: none; }

  /* ── 메뉴 배경(타이틀/스테이지 선택): 하늘 그라데이션 + 회전 햇살 + 코스터 실루엣 ── */
  .menu-bg {
    position: absolute; inset: 0; overflow: hidden; z-index: -1;
    background: linear-gradient(180deg, var(--sky-top) 0%, #57a6f0 55%, var(--sky-bottom) 100%);
  }
  .menu-bg .rays {
    position: absolute; left: 50%; top: 30%; width: 220vmax; height: 220vmax; margin: -110vmax 0 0 -110vmax;
    background: repeating-conic-gradient(rgba(255,255,255,.10) 0 10deg, transparent 10deg 20deg);
    animation: spin 60s linear infinite;
  }
  .menu-bg .cloud {
    position: absolute; background: #fff; border-radius: 999px; opacity: .85;
    box-shadow: 30px -14px 0 6px #fff, 64px 0 0 -2px #fff;
    animation: drift 40s linear infinite;
  }
  @keyframes drift { from { transform: translateX(-30vw); } to { transform: translateX(130vw); } }
  .menu-bg svg.coaster { position: absolute; left: 0; right: 0; bottom: 0; width: 100%; height: 34%; }

  /* ── 로고 ── */
  .logo { text-align: center; line-height: 1; transform: rotate(-4deg); }
  .logo-ko {
    display: inline-block; font-size: 68px; color: var(--yellow); letter-spacing: -1px;
    -webkit-text-stroke: 8px var(--navy); paint-order: stroke fill;
    text-shadow: 0 7px 0 var(--navy), 0 14px 22px rgba(0,0,0,.3);
  }
  .logo-ko .bang { color: var(--red); display: inline-block; animation: wobble 1.4s ease-in-out infinite; }
  .logo-ko .bang:nth-child(2) { animation-delay: .12s; } .logo-ko .bang:nth-child(3) { animation-delay: .24s; }
  @keyframes wobble { 0%,100% { transform: translateY(0) rotate(0); } 50% { transform: translateY(-6px) rotate(6deg); } }
  .logo-en {
    margin-top: 12px; font-size: 26px; letter-spacing: 10px; padding-left: 10px; color: #fff;
    -webkit-text-stroke: 5px var(--navy); paint-order: stroke fill; text-shadow: 0 4px 0 var(--navy);
  }
  .logo.small .logo-ko { font-size: 40px; -webkit-text-stroke-width: 6px; text-shadow: 0 5px 0 var(--navy); }
  .logo.small .logo-en { font-size: 15px; letter-spacing: 6px; margin-top: 6px; -webkit-text-stroke-width: 4px; }

  /* ── 타이틀 ── */
  .title-screen { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px; color: #fff; cursor: pointer; }
  .title-screen .logo { animation: logoDrop .7s var(--ease-pop) both; }
  @keyframes logoDrop { from { opacity: 0; transform: translateY(-60px) rotate(-4deg) scale(.8); } to { opacity: 1; transform: rotate(-4deg); } }
  .tap-hint {
    margin-top: 40px; padding: 10px 22px; border-radius: 999px; background: var(--navy-soft); font-size: 18px;
    animation: pulse 1.3s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.06); opacity: .75; } }
  .studio { position: absolute; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); font-size: 13px; color: rgba(255,255,255,.9); letter-spacing: 1px; }

  /* ── 스테이지 선택 ── */
  .stage-select {
    position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center;
    gap: 10px; color: #fff; overflow-y: auto; padding: 14px 16px 20px;
  }
  .stage-select .logo { margin-bottom: 2px; }
  .stage-select .logo.small .logo-ko { font-size: 34px; }
  .stage-select .logo.small .logo-en { font-size: 13px; margin-top: 4px; }
  .progress-summary { padding: 4px 14px; border-radius: 999px; background: var(--navy-soft); font-size: 13px; margin-top: -4px; }
  .stage-list { display: flex; flex-direction: column; gap: 8px; width: 100%; max-width: 420px; }
  .stage-btn {
    position: relative; display: flex; align-items: center; gap: 12px; text-align: left;
    padding: 9px 12px; border-radius: 18px; background: #fff; color: var(--navy); min-height: 60px;
    box-shadow: 0 5px 0 #c9d3ea, 0 10px 18px rgba(20,26,51,.18);
  }
  .stage-num {
    flex: none; width: 40px; height: 40px; border-radius: 12px; background: var(--yellow);
    display: flex; align-items: center; justify-content: center; font-size: 22px; color: var(--navy);
    box-shadow: inset 0 -3px 0 var(--yellow-deep);
  }
  .stage-info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
  .stage-name { font-size: 17px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .stage-motif { font-size: 14px; color: #5b6488; display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }
  .stage-meta { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #5b6488; }
  .stars { color: var(--yellow-deep); letter-spacing: 1px; }
  .stage-side { flex: none; display: flex; flex-direction: column; align-items: flex-end; gap: 4px; font-size: 12px; }
  .badge { padding: 3px 8px; border-radius: 999px; font-size: 12px; background: #eef1f8; color: #5b6488; }
  .badge.clear { background: var(--green); color: #fff; }
  .badge.rank-badge { background: var(--navy); color: var(--yellow); font-size: 14px; min-width: 28px; text-align: center; }
  /* ── 공통 레이아웃 토큰: 상단 내비(좌 아이콘 · 가운데 제목/로고 · 우 아이콘), 아이콘 버튼 44px, 세그먼트 컨트롤 ── */
  .top-nav {
    width: 100%; max-width: 440px; display: grid; grid-template-columns: 44px 1fr 44px; align-items: center; gap: 8px;
  }
  .top-nav .logo { justify-self: center; }
  .top-title { justify-self: center; font-size: 20px; color: #fff; letter-spacing: 2px; -webkit-text-stroke: 4px var(--navy); paint-order: stroke fill; }
  .icon-btn {
    width: 44px; height: 44px; padding: 0; border-radius: 14px; display: flex; align-items: center; justify-content: center;
    background: var(--navy); color: var(--yellow); box-shadow: 0 4px 0 #0a0e1f;
  }
  .icon-btn svg { width: 22px; height: 22px; }
  #uiRoot .icon-btn:active, #uiRoot .seg-btn:active { transform: translateY(3px); box-shadow: none; }
  .stage-detail {
    position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; gap: 14px;
    padding: 14px 16px 20px; overflow-y: auto; color: #fff;
  }
  .detail-card { max-width: 440px; gap: 12px; }
  .stage-num.big { width: 56px; height: 56px; font-size: 30px; border-radius: 16px; }
  .detail-card h2 { font-size: 26px; }
  .detail-motif { font-size: 16px; line-height: 1.5; color: #2f3a63; }
  .detail-meta { display: flex; gap: 12px; align-items: center; font-size: 14px; color: #5b6488; }
  .field { width: 100%; display: flex; flex-direction: column; gap: 6px; text-align: left; }
  .field-label { font-size: 16px; color: #2f3a63; }
  .field-desc { font-size: 16px !important; color: #2f3a63 !important; line-height: 1.5 !important; }
  .seg { display: flex; gap: 4px; padding: 4px; border-radius: 14px; background: #eef1f8; }
  .seg-btn {
    flex: 1; min-height: 44px; padding: 6px 4px; border-radius: 10px; font-size: 14px; background: transparent; color: #5b6488;
  }
  .seg-btn.on { background: var(--navy); color: var(--yellow); box-shadow: 0 3px 0 #0a0e1f; }
  .gfx-opt {
    display: flex; align-items: center; gap: 10px; width: 100%; min-height: 52px; padding: 8px 10px; border-radius: 14px;
    text-align: left; background: #f2f5fb; color: var(--navy); border: 2px solid transparent !important;
  }
  .gfx-opt.on { border-color: var(--navy) !important; background: #fff6dc; }
  .gfx-opt b { display: block; font-weight: normal; font-size: 18px; }
  .gfx-opt small { display: block; font-size: 16px; color: #2f3a63; line-height: 1.4; }
  .gfx-preview { position: relative; flex: none; width: 54px; height: 38px; border-radius: 8px; overflow: hidden; box-shadow: inset 0 0 0 1px rgba(0,0,0,.15); }
  .gfx-preview > span { position: absolute; left: 0; right: 0; bottom: 0; height: 40%; }
  .gfx-preview > i { position: absolute; left: 22px; bottom: 9px; width: 10px; height: 16px; border-radius: 2px; background: #d9432f; box-shadow: 0 0 0 2px #1a1030; }
  .graphics-open { justify-content: flex-start; }
  .actions.row { flex-direction: row; }
  .actions.row .btn { flex: 1; }
  .btn.big { min-height: 56px; font-size: 22px; letter-spacing: 2px; }
  @media (min-width: 700px) { /* 태블릿/데스크톱: 카드가 과하게 늘어나지 않게 가운데 정렬 유지, 목록은 2열 */
    .stage-list { max-width: 720px; display: grid; grid-template-columns: 1fr 1fr; }
    .top-nav { max-width: 720px; }
  }

  /* ── HUD ── .hud는 클릭을 통과시키고(캔버스가 밸런스/게이트 입력을 받음) 실제 버튼만 다시 살림 */
  #uiRoot .hud { position: relative; height: 100%; pointer-events: none; }
  .hud-top { position: absolute; top: 10px; left: 12px; right: 12px; display: flex; flex-direction: column; gap: 8px; }
  .progress { height: 8px; border-radius: 999px; background: rgba(20,26,51,.45); overflow: hidden; }
  .progress-fill { height: 100%; width: 0; border-radius: 999px; background: linear-gradient(90deg, var(--yellow), #ffd966); }
  .hud-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; color: #fff; }
  .stage-chip {
    max-width: 44%; padding: 5px 10px; border-radius: 999px; background: var(--navy-soft); font-size: 13px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .speedo { text-align: center; line-height: 1; text-shadow: 0 2px 0 var(--navy), 0 0 12px rgba(20,26,51,.5); }
  .speedo .num { font-size: 34px; color: #fff; -webkit-text-stroke: 4px var(--navy); paint-order: stroke fill; }
  .speedo .unit { font-size: 13px; color: var(--yellow); margin-left: 2px; }
  .speedo .sub { display: block; margin-top: 4px; font-size: 12px; color: #fff; }
  .speedo { position: relative; }
  .speedo .max-tag {
    position: absolute; top: 3px; left: 100%; margin-left: 4px; padding: 1px 6px; border-radius: 6px;
    background: var(--red); color: #fff; font-size: 10px; letter-spacing: 1px; text-shadow: none; opacity: 0; transition: opacity .15s ease;
  }
  /* 최고속도 상한 도달: 숫자가 노랗게 달아오르며 살짝 맥동 */
  .speedo.capped .num { color: var(--yellow); animation: capPulse .6s ease-in-out infinite; }
  .speedo.capped .max-tag { opacity: 1; }
  @keyframes capPulse { 50% { text-shadow: 0 0 14px rgba(255,184,13,.9); transform: scale(1.06); } }
  .speedo .num { display: inline-block; }
  .combo-chip {
    min-width: 64px; padding: 5px 10px; border-radius: 12px; background: var(--yellow); color: var(--navy);
    text-align: center; line-height: 1.1; box-shadow: 0 3px 0 var(--yellow-deep);
  }
  .combo-chip small { display: block; font-size: 10px; letter-spacing: 1px; }
  .combo-chip b { font-size: 18px; font-weight: normal; }
  .combo-chip .mult { margin-top: 1px; letter-spacing: 0; font-size: 11px; }
  .combo-chip.bump { animation: bump .25s var(--ease-pop); }
  @keyframes bump { 50% { transform: scale(1.18); } }

  /* ── 주행 조작: 발사 후 표시 ── */
  .drive-controls {
    position: absolute; left: 0; right: 0; bottom: 0; padding: 0 10px calc(10px + env(safe-area-inset-bottom, 0px));
    pointer-events: none; opacity: 0; transform: translateY(20px); transition: opacity .25s ease, transform .25s ease;
  }
  .drive-controls.on { opacity: 1; transform: none; }
  .drive-controls.on .ctl-btn { pointer-events: auto; }
  /* 양손(13번): 왼쪽 아래 ◀ ▶, 오른쪽 아래 BOOST — 양 끝 엄지 위치, 가운데는 비워 손가락이 겹치지 않게(한손 패드 CSS는 legacy/onehand-pad.js) */
  .drive-controls.twohand {
    display: flex; align-items: flex-end; justify-content: space-between; gap: 24px;
    padding-left: calc(12px + env(safe-area-inset-left, 0px)); padding-right: calc(12px + env(safe-area-inset-right, 0px));
  }
  .ctl-left, .ctl-right { position: relative; display: flex; flex-direction: column; gap: 10px; }
  .ctl-left { align-items: flex-start; }
  .ctl-right { align-items: flex-end; }
  .lean-btns { display: flex; gap: 12px; }
  .drive-controls.tilt .lean-btns { display: none; } /* 기울기 모드: ◀ ▶ 대신 폰 기울기 */
  .ctl-btn {
    min-width: 64px; min-height: 64px; border-radius: 20px; font-size: 26px; color: var(--navy); background: rgba(255,255,255,.85);
    box-shadow: 0 5px 0 #b8c2dc, 0 8px 16px rgba(0,0,0,.25);
    touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  }
  .ctl-btn.lean { width: 72px; height: 72px; }
  .ctl-btn.boost { min-width: 108px; min-height: 108px; border-radius: 50%; font-size: 22px; background: var(--yellow); box-shadow: 0 6px 0 var(--yellow-deep), 0 10px 20px rgba(0,0,0,.3); }
  #uiRoot .ctl-btn.pressed { transform: translateY(4px) scale(.96); box-shadow: 0 1px 0 #b8c2dc; filter: brightness(1.08); }
  .drive-controls { -webkit-touch-callout: none; }

  .rb-overlay { position: absolute; left: 0; right: 0; top: 26%; text-align: center; pointer-events: none; opacity: 0; transition: opacity .15s ease; }
  .rb-overlay.on { opacity: 1; }
  .rb-title { font-size: 40px; color: var(--red); -webkit-text-stroke: 6px var(--navy); paint-order: stroke fill; animation: wobble .5s ease-in-out infinite; }
  .rb-overlay.mash .rb-title { color: var(--yellow); animation: pulse .25s ease-in-out infinite; }
  .rb-gauge { width: 70%; max-width: 280px; height: 18px; margin: 8px auto 0; border-radius: 999px; background: rgba(20,26,51,.65); border: 3px solid #fff; overflow: hidden; }
  .rb-gauge-fill { height: 100%; width: 0; background: linear-gradient(90deg, var(--yellow), var(--red)); transition: width .08s linear; }
  .rb-sub { margin-top: 6px; font-size: 16px; color: #fff; -webkit-text-stroke: 4px var(--navy); paint-order: stroke fill; }
  .detail-warn { font-size: 16px !important; line-height: 1.45 !important; color: #d9432f !important; }
  .lift-hint { position: absolute; left: 0; right: 0; top: 40%; text-align: center; font-size: 17px; color: #bfe9ff; opacity: 0; transition: opacity .3s ease;
    -webkit-text-stroke: 4px var(--navy); paint-order: stroke fill; pointer-events: none; }
  .lift-hint.on { opacity: 1; animation: pulse 1.2s ease-in-out infinite; }
  /* 판정 토스트(게이트 탭 결과) */
  .judge { position: absolute; top: 30%; left: 0; right: 0; text-align: center; pointer-events: none; font-size: 40px;
    -webkit-text-stroke: 6px var(--navy); paint-order: stroke fill; opacity: 0; }
  .judge.show { animation: judgePop .7s var(--ease-pop) forwards; }
  @keyframes judgePop { 0% { opacity: 0; transform: scale(.4); } 25% { opacity: 1; transform: scale(1.1); } 70% { opacity: 1; transform: scale(1); } 100% { opacity: 0; transform: translateY(-20px); } }
  .judge.perfect { color: var(--yellow); } .judge.good { color: var(--green); } .judge.miss { color: var(--red); }

  /* 밸런스 게이지(13·14번): ◀ ▶ 바로 위 — 회색 바(−1~+1) = 범위 밖, 초록 성공 띠 = 최소선(진한 선 + 아래 눈금)부터 커브 쪽 끝까지 한 덩어리,
     파란 Perfect 띠(흰 테두리) = 성공 띠 안의 보너스 구간 — 가운데 정렬이 아니어도 색·테두리로 구분. 아래를 가리키는 삼각형 커서 + 세로선,
     아래 막대 = 연속 유지 진행도. 커서가 띠 안이면 띠가 밝아짐 */
  .bal-gauge { position: relative; width: 156px; height: 62px; opacity: 0; transition: opacity .2s ease; pointer-events: none; }
  .bal-gauge.on { opacity: 1; }
  .bal-dir { position: absolute; left: 0; top: -6px; font-size: 26px; line-height: 26px; color: #5dff9a; -webkit-text-stroke: 4px var(--navy); paint-order: stroke fill; animation: dirNudgeL .6s ease-in-out infinite; }
  .bal-dir.right { left: auto; right: 0; animation-name: dirNudgeR; }
  @keyframes dirNudgeL { 50% { transform: translateX(-4px); } } @keyframes dirNudgeR { 50% { transform: translateX(4px); } }
  .bal-bar { position: absolute; left: 0; right: 0; top: 26px; height: 18px; border-radius: 6px; background: #5d6584; border: 2px solid var(--navy); overflow: hidden; }
  .bal-band { position: absolute; top: 0; bottom: 0; background: #34b06a; transition: background .1s ease; }
  .bal-gauge.in .bal-band { background: #6dffa5; } /* 번짐(glow) 없이 밝기만 — 최소선 경계가 흐려지지 않게 */
  .bal-perfect { position: absolute; top: 1px; bottom: 1px; border-radius: 4px; background: #2563eb; box-shadow: inset 0 0 0 2px #fff; }
  .bal-gauge.perfect .bal-perfect { background: #4da3ff; box-shadow: inset 0 0 0 2px #fff; }
  /* Perfect 범위 안: 커서도 파랗게 — 좁은 파란 띠를 커서가 가려도 상태가 보이게 */
  .bal-gauge.perfect .bal-cursor { border-top-color: #4da3ff; } .bal-gauge.perfect .bal-cursor::after { background: #4da3ff; }
  .bal-min { position: absolute; top: 0; bottom: 0; width: 3px; margin-left: -1.5px; background: #0b3d22; } /* 성공 띠가 시작되는 최소선 */
  .bal-min-tick { position: absolute; top: 48px; width: 0; height: 0; margin-left: -4px; border-left: 4px solid transparent; border-right: 4px solid transparent; border-bottom: 5px solid #5dff9a; }
  .bal-zero { position: absolute; left: 50%; bottom: 0; width: 2px; height: 5px; margin-left: -1px; background: rgba(20,26,51,.7); }
  .bal-cursor { position: absolute; top: 14px; left: 50%; width: 0; height: 0; margin-left: -8px; pointer-events: none;
    border-left: 8px solid transparent; border-right: 8px solid transparent; border-top: 11px solid var(--yellow); filter: drop-shadow(0 0 1px var(--navy)) drop-shadow(0 0 1px var(--navy)); }
  .bal-cursor::after { content: ''; position: absolute; left: -1px; top: 0; width: 2px; height: 20px; background: var(--yellow); box-shadow: 0 0 0 1px var(--navy); }
  .bal-prog { position: absolute; left: 0; right: 0; top: 54px; height: 7px; border-radius: 999px; background: rgba(20,26,51,.6); overflow: hidden; }
  .bal-prog-fill { height: 100%; width: 0; background: linear-gradient(90deg, #5dff9a, var(--yellow)); }
  .bal-gauge.done .bal-prog-fill { background: var(--yellow); }
  .bal-result { position: absolute; left: 0; right: 0; top: -26px; text-align: center; font-size: 22px; white-space: nowrap; opacity: 0; -webkit-text-stroke: 5px var(--navy); paint-order: stroke fill; }
  .bal-result.show { animation: judgePop .8s var(--ease-pop) forwards; }
  .bal-result.perfect { color: var(--yellow); } .bal-result.good { color: var(--green); } .bal-result.miss { color: var(--red); }
  .judge.small { font-size: 30px; }

  /* 부스트 타이밍 팝업(13번): 화면 위쪽 가운데 — 바깥 흰 원이 줄어들어 안쪽 원과 겹치는 순간이 정타 */
  .timing-pop { position: absolute; left: 50%; top: calc(146px + env(safe-area-inset-top, 0px)); width: 112px; height: 112px; margin-left: -56px;
    pointer-events: none; opacity: 0; transform: scale(.7); transition: opacity .15s ease, transform .2s var(--ease-pop); }
  .timing-pop.on { opacity: 1; transform: none; }
  .timing-pop svg { width: 100%; height: 100%; overflow: visible; }
  .tp-bg { fill: rgba(20,26,51,.7); stroke: rgba(255,255,255,.5); stroke-width: 2; }
  .tp-good { fill: none; stroke: rgba(255,184,13,.75); }
  .tp-perfect { fill: none; stroke: var(--green); }
  .tp-target { fill: none; stroke: #fff; stroke-width: 1.5; stroke-dasharray: 3 3; }
  .tp-ring { fill: none; stroke: #fff; stroke-width: 4; filter: drop-shadow(0 0 2px rgba(20,26,51,.9)); }
  .timing-pop.ready .tp-ring { stroke: var(--yellow); }
  .timing-pop.ready .tp-bg { stroke: var(--green); stroke-width: 4; }
  .timing-pop.finish .tp-bg { fill: rgba(80,20,60,.6); }
  .tp-label { position: absolute; left: -20px; right: -20px; top: 100%; margin-top: 2px; text-align: center; font-size: 15px; line-height: 18px; color: #fff;
    -webkit-text-stroke: 3px var(--navy); paint-order: stroke fill; }
  .tp-result { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); white-space: nowrap; font-size: 38px; opacity: 0;
    -webkit-text-stroke: 6px var(--navy); paint-order: stroke fill; }
  .tp-result.show { animation: judgePopC .7s var(--ease-pop) forwards; }
  .tp-result.perfect { color: var(--yellow); } .tp-result.good { color: var(--green); } .tp-result.miss { color: var(--red); }
  .timing-pop.result svg, .timing-pop.result .tp-label { opacity: 0; }
  @keyframes judgePopC { 0% { opacity: 0; transform: translate(-50%, -50%) scale(.4); } 25% { opacity: 1; transform: translate(-50%, -50%) scale(1.15); }
    70% { opacity: 1; transform: translate(-50%, -50%) scale(1); } 100% { opacity: 0; transform: translate(-50%, -80%) scale(1); } }

  /* 스타트 바: 엄지가 닿는 하단 중앙 세로 레일 — 아래로 당겨 충전, 위로 튕겨 발사 */
  .start-bar {
    position: absolute; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%);
    display: flex; flex-direction: column; align-items: center; gap: 8px;
    pointer-events: auto; touch-action: none; /* 이 안에서만 드래그를 받고 브라우저 제스처(스크롤/바운스)는 차단 */
    padding: 8px 24px; transition: opacity .3s ease, transform .3s ease;
  }
  .start-bar.launched { opacity: 0; transform: translateX(-50%) translateY(-24px); pointer-events: none; }
  .start-bar-label { color: #fff; font-size: 17px; text-align: center; line-height: 1.25; -webkit-text-stroke: 4px var(--navy); paint-order: stroke fill; }
  .start-bar-label.nudge { animation: nudgeX .4s ease; }
  @keyframes nudgeX { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
  .start-bar-track {
    position: relative; width: 64px; height: 200px; border-radius: 32px;
    background: rgba(20,26,51,.55); border: 3px solid #fff; box-shadow: 0 6px 16px rgba(0,0,0,.25);
  }
  .start-bar-fill { position: absolute; top: 4px; left: 4px; right: 4px; height: 0; border-radius: 26px; background: linear-gradient(180deg, var(--yellow), #ff7a3d); }
  .start-bar-handle {
    position: absolute; top: 4px; left: 4px; width: 50px; height: 50px; border-radius: 50%;
    background: var(--yellow); color: var(--navy); display: flex; align-items: center; justify-content: center;
    box-shadow: 0 3px 0 var(--yellow-deep), 0 4px 10px rgba(0,0,0,.35); z-index: 1;
  }
  .start-bar-handle svg { width: 26px; height: 26px; }
  .start-power { width: 140px; height: 10px; border-radius: 999px; background: rgba(20,26,51,.6); border: 2px solid #fff; overflow: hidden; }
  .start-power-fill { height: 100%; width: 0; background: linear-gradient(90deg, var(--yellow), #ff5a4e); }
  .start-power-fill.max { animation: pulse .4s ease-in-out infinite; }
  .key-hint { display: none; font-size: 12px; color: #fff; -webkit-text-stroke: 3px var(--navy); paint-order: stroke fill; }
  @media (hover: hover) and (pointer: fine) { .key-hint { display: block; } } /* 데스크톱에서만 키 안내 */
  /* 일시정지/사운드/카메라: 엄지 패드·스타트 바와 겹치지 않게 화면 위쪽(콤보 배지 아래) */
  .hud-controls {
    position: absolute; top: calc(92px + env(safe-area-inset-top, 0px)); right: 12px;
    display: flex; align-items: center; gap: 8px; pointer-events: auto;
  }
  .hud-icon-btn {
    width: 44px; height: 44px; padding: 0; border-radius: 50%; background: #fff; color: var(--navy);
    display: flex; align-items: center; justify-content: center; pointer-events: auto;
    box-shadow: 0 4px 0 #b8c2dc, 0 6px 12px rgba(0,0,0,.25);
  }
  .hud-icon-btn svg { width: 22px; height: 22px; }

  /* ── 튜토리얼(13번) ── */
  .tut-banner { position: absolute; left: 50%; bottom: calc(178px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); width: min(92vw, 420px);
    padding: 8px 14px; border-radius: 16px; background: rgba(20,26,51,.85); color: #fff; font-size: 15px; line-height: 1.35; text-align: center;
    pointer-events: none; opacity: 0; transition: opacity .2s ease; box-shadow: 0 4px 0 rgba(0,0,0,.25); }
  .tut-banner.on { opacity: 1; }
  .tut-banner small { display: block; font-size: 11px; letter-spacing: 1px; color: var(--yellow); }
  .tut-banner b { color: var(--yellow); font-weight: normal; }
  .tut-banner.hint { background: rgba(160,40,40,.9); }
  .tut-banner.shake { animation: nudgeX .4s ease; }
  .tut-skip { min-height: 44px; padding: 0 14px; border-radius: 12px; background: #fff; color: var(--navy); font-size: 15px; pointer-events: auto;
    box-shadow: 0 4px 0 #b8c2dc; }
  .tut-ring { position: fixed; z-index: 15; pointer-events: none; border-radius: 22px; border: 4px solid var(--yellow);
    box-shadow: 0 0 0 4px rgba(20,26,51,.55), 0 0 18px rgba(255,184,13,.9); animation: tutBlink .9s ease-in-out infinite; }
  @keyframes tutBlink { 50% { opacity: .25; } }
  .tut-finger { position: fixed; z-index: 16; width: 36px; height: 36px; pointer-events: none; animation: tutTap 1s ease-in-out infinite; filter: drop-shadow(0 2px 2px rgba(0,0,0,.4)); }
  .tut-finger svg { width: 100%; height: 100%; }
  @keyframes tutTap { 0%, 100% { transform: translate(6px, 10px); } 50% { transform: translate(0, 0) scale(.92); } }
  .card.tut-card { max-width: 400px; }
  .card.tut-card p { font-size: 18px; line-height: 1.55; color: #2f3a63; } .tut-card p b { color: var(--navy); font-weight: normal; background: #fff1c2; padding: 0 3px; border-radius: 4px; }
  .tut-step { font-size: 16px; letter-spacing: 2px; color: #5b6488; margin-bottom: -8px; }
  .tut-pic { width: 100%; background: #f2f5fb; border-radius: 14px; padding: 6px; }
  .diagram { display: block; width: 100%; height: auto; font-family: 'Jua', sans-serif; }
  .stage-btn.tutorial-btn { background: #eafff2; box-shadow: 0 5px 0 #a8e6c1, 0 10px 18px rgba(20,26,51,.18); }
  .tutorial-btn .stage-num { width: auto; padding: 0 8px; font-size: 15px; background: var(--green); color: #fff; box-shadow: inset 0 -3px 0 #23a862; }
  @media (orientation: landscape) and (max-height: 500px) {
    .tut-banner { bottom: calc(160px + env(safe-area-inset-bottom, 0px)); width: min(50vw, 420px); }
    /* 가로: 카드가 화면 높이를 넘지 않게 2열(그림 | 설명+버튼) */
    .tut-card-overlay { padding: 8px; }
    .card.tut-card { max-width: 640px; display: grid; grid-template-columns: 1fr 1fr; align-items: center; gap: 6px 14px; padding: 14px 18px; }
    .card.tut-card .tut-step, .card.tut-card h2 { grid-column: 1 / -1; }
    .card.tut-card h2 { font-size: 22px; }
    .card.tut-card .tut-pic { grid-row: span 2; }
    .card.tut-card p { font-size: 16px; line-height: 1.45; }
    .card.tut-card .actions { margin-top: 0; }
    .card.tut-card:not(:has(.tut-pic)) p, .card.tut-card:not(:has(.tut-pic)) .actions { grid-column: 1 / -1; }
  }

  /* ── 모달(일시정지/로딩/에러/조작법/크레딧/결과) ── */
  .modal-overlay {
    position: absolute; inset: 0; z-index: 20; pointer-events: auto;
    display: flex; align-items: center; justify-content: center; padding: 20px;
    background: rgba(12, 16, 36, .62); color: var(--navy);
    overflow-y: auto; /* 카드가 화면보다 길면(작은 폰) 위가 잘리지 않고 스크롤 */
  }
  .modal-overlay > .card { margin: auto; }
  .modal-overlay.solid { background: linear-gradient(180deg, var(--sky-top), var(--sky-bottom)); }
  .card {
    width: 100%; max-width: 360px; border-radius: 24px; background: #fff; padding: 26px 22px 22px;
    display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center;
    box-shadow: 0 8px 0 #c9d3ea, 0 18px 40px rgba(0,0,0,.35);
  }
  .card h2 { font-size: 28px; color: var(--navy); }
  .card p { font-size: 16px; line-height: 1.55; color: #2f3a63; }
  .card .actions { display: flex; flex-direction: column; gap: 10px; width: 100%; margin-top: 4px; }
  .ribbon {
    margin-top: -46px; padding: 8px 26px; border-radius: 14px; background: var(--yellow); color: var(--navy);
    font-size: 24px; box-shadow: 0 4px 0 var(--yellow-deep);
  }
  .loading-card { background: transparent; box-shadow: none; color: #fff; }
  .loading-card p { color: #fff; }
  .spinner {
    width: 54px; height: 54px; border-radius: 50%;
    border: 6px solid rgba(255,255,255,.35); border-top-color: var(--yellow);
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .howto-list { display: flex; flex-direction: column; gap: 10px; width: 100%; text-align: left; }
  .howto-item { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 14px; background: #f2f5fb; }
  .howto-item .ico { flex: none; width: 42px; height: 42px; border-radius: 12px; background: var(--navy); color: var(--yellow); display: flex; align-items: center; justify-content: center; }
  .howto-item .ico svg { width: 24px; height: 24px; }
  .howto-item b { display: block; font-weight: normal; font-size: 18px; color: var(--navy); }
  .howto-item.legend { display: block; }
  .howto-item .tut-pic { margin-top: 6px; background: #fff; }
  .howto-item b.em { display: inline; font-size: 16px; color: var(--navy); background: #fff1c2; padding: 0 3px; border-radius: 4px; }
  .legend-row { display: flex !important; flex-wrap: wrap; align-items: center; gap: 4px 6px; margin-top: 4px; }
  .legend-row i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; box-shadow: 0 0 0 1px rgba(0,0,0,.25); }
  .howto-list { max-height: 60vh; overflow-y: auto; }
  .howto-item span { font-size: 16px; color: #2f3a63; line-height: 1.45; }
  .credits-list { display: flex; flex-direction: column; gap: 12px; width: 100%; }
  .credits-list p { font-size: 16px; line-height: 1.5; }
  .credits-list strong { color: var(--navy); font-weight: normal; font-size: 17px; }
  .credits-list a { color: #2f6fd6; }
  .tester-card { align-self: center; padding: 10px 26px; border-radius: 16px; background: var(--yellow); box-shadow: 0 4px 0 var(--yellow-deep); }
  .tester-card small { display: block; font-size: 11px; letter-spacing: 3px; color: var(--navy); }
  .tester-card b { font-weight: normal; font-size: 24px; color: var(--navy); }

  /* 결과 */
  .result-card { gap: 8px; padding: 24px 18px 18px; }
  .result-card .ribbon { margin-top: -40px; }
  .result-card .btn { min-height: 44px; padding: 10px 20px; }
  .result-card .actions { gap: 8px; }
  .rank {
    width: 72px; height: 72px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
    font-size: 42px; color: var(--navy); background: var(--yellow); box-shadow: inset 0 -6px 0 var(--yellow-deep), 0 6px 14px rgba(0,0,0,.2);
    animation: rankIn .6s .15s var(--ease-pop) both;
  }
  .rank.S { background: linear-gradient(135deg, #ffe066, #ffb80d); } .rank.C { background: #d8deee; box-shadow: inset 0 -6px 0 #b8c2dc; }
  @keyframes rankIn { from { opacity: 0; transform: scale(.2) rotate(-30deg); } to { opacity: 1; transform: none; } }
  .result-stage { font-size: 14px; color: #5b6488; }
  .result-score { font-size: 34px; color: var(--navy); line-height: 1; }
  .result-score small { display: block; font-size: 13px; color: #5b6488; margin-bottom: 4px; }
  .new-best { padding: 3px 12px; border-radius: 999px; background: var(--red); color: #fff; font-size: 13px; animation: pulse 1s ease-in-out infinite; }
  .breakdown { width: 100%; padding: 8px 12px; border-radius: 14px; background: #f2f5fb; display: flex; flex-direction: column; gap: 3px; }
  .bd-row { display: flex; justify-content: space-between; font-size: 13px; color: #5b6488; }
  .bd-row b { font-weight: normal; color: var(--navy); }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; width: 100%; }
  .stat { padding: 7px 10px; border-radius: 14px; background: #f2f5fb; text-align: left; }
  .stat small { display: block; font-size: 12px; color: #5b6488; }
  .stat b { font-weight: normal; font-size: 18px; color: var(--navy); }
  .stat.full { grid-column: 1 / -1; }
  .judge-row { display: flex; gap: 6px; margin-top: 4px; }
  .judge-row span { flex: 1; padding: 4px 0; border-radius: 8px; text-align: center; font-size: 13px; color: #fff; }
  .judge-row .p { background: #e0a000; } .judge-row .g { background: #27b36a; } .judge-row .m { background: #e5484d; }

  .update-toast {
    position: fixed; z-index: 50; left: 50%; top: calc(64px + env(safe-area-inset-top, 0px)); transform: translateX(-50%);
    padding: 10px 16px; border: none; border-radius: 999px; background: var(--yellow); color: var(--navy);
    font-family: inherit; font-size: 14px; box-shadow: 0 4px 0 var(--yellow-deep), 0 8px 18px rgba(0,0,0,.3); cursor: pointer;
    animation: screenIn .3s ease both;
  }
  /* 가로 화면(13번: 회전 안내 오버레이 제거, 가로·세로 모두 플레이) — 폰 가로(높이 500 이하)에서 HUD를 납작하게,
     조작은 양쪽 엄지 위치(아래 양 끝), 노치·홈 인디케이터는 safe-area로 피함 */
  @media (orientation: landscape) and (max-height: 500px) {
    .hud-top { top: 6px; left: calc(12px + env(safe-area-inset-left, 0px)); right: calc(170px + env(safe-area-inset-right, 0px)); gap: 4px; }
    .speedo .num { font-size: 28px; }
    .hud-controls { top: calc(8px + env(safe-area-inset-top, 0px)); right: calc(12px + env(safe-area-inset-right, 0px)); }
    .timing-pop { top: calc(58px + env(safe-area-inset-top, 0px)); width: 96px; height: 96px; margin-left: -48px; }
    .drive-controls { padding-bottom: calc(14px + env(safe-area-inset-bottom, 0px)); }
    .drive-controls.twohand { padding-left: calc(20px + env(safe-area-inset-left, 0px)); padding-right: calc(20px + env(safe-area-inset-right, 0px)); }
    .start-bar { bottom: calc(10px + env(safe-area-inset-bottom, 0px)); gap: 4px; }
    .start-bar-track { height: 150px; }
    .start-bar-label { font-size: 15px; }
    .lap-banner { top: 28%; }
    .rb-overlay { top: 22%; }

  @media (max-height: 620px) { /* 아주 낮은 화면: 타이틀/목록 간격 축소 */
