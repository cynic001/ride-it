<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>떨어진다!!! RIDE IT - chaechae studio</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    width: 100%; height: 100%; overflow: hidden; background: #000; font-family: -apple-system, 'Pretendard', sans-serif;
    overscroll-behavior: none; /* 스타트 바 드래그 중 페이지 자체가 바운스/스크롤되는 것 방지 */
  }

  #renderCanvas { width: 100%; height: 100%; touch-action: none; outline: none; display: block; }

  #uiRoot {
    position: fixed; inset: 0; pointer-events: none;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  #uiRoot .screen { pointer-events: auto; }

  .stage-select {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    height: 100%; gap: 16px; color: #fff; background: rgba(0,0,0,0.55);
  }
  .stage-select h1 { font-size: 28px; margin-bottom: 8px; }
  .stage-list { display: flex; flex-direction: column; gap: 10px; width: 85%; max-width: 400px; }
  .stage-btn {
    display: flex; flex-direction: column; align-items: flex-start;
    padding: 14px 16px; border-radius: 12px; border: none;
    background: rgba(255,255,255,0.1); color: #fff; min-height: 44px;
  }
  .stage-name { font-size: 17px; font-weight: 600; }
  .stage-motif { font-size: 12px; opacity: 0.7; margin-top: 4px; }
  .quality-toggle {
    margin-top: 12px; padding: 10px 18px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.3);
    background: transparent; color: #fff; min-height: 44px; min-width: 44px;
  }

  /* .hud는 전체 화면을 덮는 오버레이지만, 실제 조작(드래그 스타트/밸런스/게이트 탭)은
     input.js가 캔버스에서 직접 받아야 하므로 hud 자체는 클릭을 통과시키고
     그 안의 실제 버튼(camera-toggle)만 다시 pointer-events: auto로 살린다.
     (#uiRoot .screen의 pointer-events:auto보다 명시도가 같거나 높아야 하므로 #uiRoot .hud로 지정) */
  #uiRoot .hud { position: relative; height: 100%; pointer-events: none; }
  .top-bar {
    position: absolute; top: 12px; left: 0; right: 0;
    display: flex; justify-content: space-between; padding: 0 16px;
    color: #fff; font-size: 15px; text-shadow: 0 1px 3px rgba(0,0,0,0.6);
  }
  .start-bar {
    position: absolute; bottom: 22%; left: 50%; transform: translateX(-50%);
    display: flex; flex-direction: column; align-items: center; gap: 10px;
    pointer-events: auto; touch-action: none; /* 이 안에서만 드래그를 받고 브라우저 제스처는 차단 */
    transition: opacity 0.3s ease, transform 0.3s ease;
  }
  .start-bar.launched { opacity: 0; transform: translateX(-50%) translateY(16px); pointer-events: none; }
  .start-bar-label { color: #fff; font-size: 15px; text-shadow: 0 1px 3px rgba(0,0,0,0.6); }
  .start-bar-track {
    position: relative; width: 220px; height: 56px; border-radius: 28px;
    background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.35);
  }
  .start-bar-fill {
    position: absolute; top: 4px; left: 4px; height: calc(100% - 8px); width: 0;
    border-radius: 24px; background: rgba(255,196,0,0.85);
  }
  .start-bar-handle {
    position: absolute; top: 4px; left: 4px; width: 48px; height: 48px; border-radius: 50%;
    background: #fff; color: #111; display: flex; align-items: center; justify-content: center;
    font-size: 18px; box-shadow: 0 2px 6px rgba(0,0,0,0.4);
  }
  .hud-controls {
    position: absolute; bottom: env(safe-area-inset-bottom, 16px); right: 16px;
    display: flex; align-items: center; gap: 8px; pointer-events: auto;
  }
  .hud-icon-btn {
    width: 44px; height: 44px; border-radius: 50%; border: none;
    background: rgba(255,255,255,0.85); color: #111; font-size: 18px;
    display: flex; align-items: center; justify-content: center; pointer-events: auto;
  }
  .hud-icon-btn:disabled { opacity: 0.4; }
  .camera-toggle {
    padding: 10px 16px; border-radius: 20px; border: none;
    background: rgba(255,255,255,0.85); color: #111; min-height: 44px; min-width: 44px;
    pointer-events: auto;
  }
  .camera-toggle:disabled { opacity: 0.4; }

  .result {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    height: 100%; gap: 14px; color: #fff; background: rgba(0,0,0,0.7);
  }
  .result .score { font-size: 22px; }
  .result button { padding: 12px 22px; border-radius: 12px; border: none; min-height: 44px; }

  /* 일시정지/로딩/에러/조작법 안내 공용 오버레이 */
  .modal-overlay {
    position: absolute; inset: 0; z-index: 20; pointer-events: auto;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; padding: 24px; text-align: center; color: #fff; background: rgba(0,0,0,0.78);
  }
  .modal-overlay h2 { font-size: 20px; }
  .modal-overlay p { font-size: 14px; line-height: 1.5; opacity: 0.85; }
  .modal-overlay button {
    padding: 12px 22px; border-radius: 12px; border: none; min-height: 44px;
    background: rgba(255,255,255,0.15); color: #fff;
  }
  .modal-overlay button.primary { background: rgba(255,196,0,0.9); color: #111; font-weight: 600; }
  .spinner {
    width: 36px; height: 36px; border-radius: 50%;
    border: 4px solid rgba(255,255,255,0.25); border-top-color: #fff;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .howto-list { display: flex; flex-direction: column; gap: 10px; text-align: left; max-width: 320px; }
  .howto-list p { font-size: 14px; }

  .rotate-warning {
    display: none; position: fixed; inset: 0; z-index: 9999;
    flex-direction: column; align-items: center; justify-content: center; gap: 12px;
    background: #000; color: #fff; text-align: center;
  }
  .rotate-icon { font-size: 48px; animation: rotate-hint 1.6s ease-in-out infinite; }
  @keyframes rotate-hint { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(90deg); } }
  /* 폰 세로 전용 UI(스타트 바/게이트 탭 영역 비율) 기준 — 가로 폭이 넓은 태블릿/데스크톱 창은 제외 */
  @media (orientation: landscape) and (max-height: 500px) {
    .rotate-warning { display: flex; }
  }

  @media (prefers-color-scheme: light) {
    /* 라이트 모드에서도 UI는 게임 톤 유지 위해 다크 오버레이 고정 */
  }
</style>
</head>
<body>
  <canvas id="renderCanvas"></canvas>
  <div id="uiRoot"></div>
  <div class="rotate-warning" id="rotateWarning">
    <div class="rotate-icon">📱</div>
    <p>세로로 돌려주세요</p>
  </div>

  <!-- Babylon.js CDN (UMD 빌드, 버전 고정) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babylonjs/7.25.0/babylon.js"></script>
  <!-- glTF/.glb 로더 — cdnjs엔 babylonjs-loaders 패키지가 없어 jsdelivr로 같은 버전 고정 -->
  <script src="https://cdn.jsdelivr.net/npm/babylonjs-loaders@7.25.0/babylonjs.loaders.min.js"></script>

  <!-- 게임 스크립트 (의존성 순서 유지) -->
  <script src="js/quality.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/stages.js"></script>
  <script src="js/track.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/camera.js"></script>
  <script src="js/input.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
